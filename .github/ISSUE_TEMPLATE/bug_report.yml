name: Bug report
description: Report a reproducible GeNewWord Engine defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use private vulnerability reporting.
  - type: textarea
    id: outcome
    attributes:
      label: Observed behavior
      description: What happened, and what authoritative readback proves it?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest commands or request transcript and relevant versions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS or Linux, Python version, Node version when relevant
    validations:
      required: true
